<div class="view-evo-container">

  <div class="view-evo-header">
    <button class="btn-back" (click)="voltar()">&#8592; Voltar</button>
    @if (!editMode) {
      <button class="btn-edit" (click)="entrarEdicao()">✏️ Editar</button>
    }
  </div>

  @if (!editMode) {
    <div class="evo-card">
      <div class="evo-meta">
        @if (patientName) {
          <span class="evo-patient">{{ patientName }}</span>
        }
        @if (data) {
          <span class="evo-date">{{ data | date:'dd/MM/yyyy' }}</span>
        }
      </div>

      <h1 class="evo-title">{{ titulo || 'Ficha de Evolução' }}</h1>

      <div class="evo-divider"></div>

      <div class="evo-section">
        <span class="section-label">Evolução</span>
        <p class="evo-text">{{ texto }}</p>
      </div>

      @if (planoProximaSessao) {
        <div class="evo-section evo-plano">
          <span class="section-label">Plano para a próxima sessão</span>
          <p class="evo-text">{{ planoProximaSessao }}</p>
        </div>
      }
    </div>
  }

  @if (editMode) {
    <form class="evo-form" (ngSubmit)="salvar()">
      <div class="form-group">
        <label>Título <span class="hint">(opcional)</span></label>
        <input
          type="text"
          [(ngModel)]="titulo"
          name="titulo"
          placeholder="Ex.: Sessão de avaliação fonoaudiológica"
        />
      </div>

      <div class="form-group evo-text-group">
        <label>Evolução <span class="required">*</span></label>
        <textarea
          [(ngModel)]="texto"
          name="texto"
          class="evo-textarea"
          placeholder="Descreva a evolução do paciente nesta sessão..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label>Plano para a próxima sessão <span class="hint">(opcional)</span></label>
        <textarea
          [(ngModel)]="planoProximaSessao"
          name="planoProximaSessao"
          class="plano-textarea"
          placeholder="Objetivos e atividades planejadas para a próxima sessão..."
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancelarEdicao()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="!texto.trim() || saving">
          {{ saving ? 'Salvando...' : 'Salvar Alterações' }}
        </button>
      </div>
    </form>
  }

</div>
